name: calculator_mzkyzak
description: "Calculator by MZKYZAK"
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_animate: ^4.5.0
  math_expressions: ^2.3.1
  shared_preferences: ^2.2.2
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/lagu_jj.mp3

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  